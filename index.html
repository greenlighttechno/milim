<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milim Hebrew Reference</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search header + section tabs; list views and single-entry pages routed on #hash; reading texts below. */
:root{
  --paper:#f4f6f9; --sheet:#ffffff; --ink:#18202e; --muted:#5d6779; --line:#dde2ea;
  --tekhelet:#2747a0; --tekhelet-soft:#e6ebf7; --root:#9a6512; --root-soft:#f7eedd; --rec:#1f7a55; --rec-soft:#e2f3ea;
  --he-display:"Frank Ruhl Libre","Times New Roman",serif;
  --he-text:"IBM Plex Sans Hebrew","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --sheet:#181e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3242;
  --tekhelet:#8fa8ee; --tekhelet-soft:#1f2a45; --root:#e0b25d; --root-soft:#352a17; --rec:#6fd1a4; --rec-soft:#173327; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3242;
  --tekhelet:#8fa8ee; --tekhelet-soft:#1f2a45; --root:#e0b25d; --root-soft:#352a17; --rec:#6fd1a4; --rec-soft:#173327; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.he{font-family:var(--he-text);direction:rtl;unicode-bidi:isolate}
.tr{font-family:var(--mono);font-size:.86em;color:var(--muted)}
a{color:var(--tekhelet)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tekhelet);outline-offset:2px}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sheet);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand b{font-family:var(--he-display);font-size:28px;font-weight:700;line-height:1;color:var(--tekhelet)}
.brand span{font-weight:600;letter-spacing:.02em}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--ui)}
.search input:focus{border-color:var(--tekhelet);outline:none;box-shadow:0 0 0 3px var(--tekhelet-soft)}
#results{position:absolute;inset:calc(100% + 6px) 0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:60vh;overflow:auto}
#results a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
#results a:last-child{border-bottom:0}
#results a:hover,#results a.sel{background:var(--tekhelet-soft)}
#results .he{font-size:18px}
#results .why{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav a{flex:none;padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
nav a.on{background:var(--tekhelet);color:var(--sheet)}
nav a:not(.on):hover{background:var(--tekhelet-soft);color:var(--ink)}

main{padding-block:24px 64px}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:32px 0 10px;font-weight:600}
.lede{color:var(--muted);max-width:65ch;margin:0 0 20px}

/* list rows */
.rows{display:grid;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:2.6rem minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--tekhelet-soft)}
.row .he{font-size:20px;text-align:right;font-family:var(--he-display)}
.row .en{min-width:0}
.row .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--root-soft);color:var(--root);font-family:var(--he-text);direction:rtl;text-decoration:none;white-space:nowrap}
a.chip:hover{outline:1px solid var(--root)}
.g{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}

/* play buttons */
.play{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.play svg{width:14px;height:14px;fill:currentColor}
.play.rec{border-color:var(--rec);color:var(--rec);background:var(--rec-soft)}
.play:hover{color:var(--tekhelet);border-color:var(--tekhelet)}
.play.rec:hover{color:var(--rec);filter:brightness(1.05)}
.play.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--tekhelet-soft)}}
@media (prefers-reduced-motion: reduce){.play.on{animation:none;outline:2px solid var(--tekhelet)}}
.play.loading{position:relative;color:transparent}
.play.loading::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid var(--rec);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.play.loading::after{animation-duration:2.5s}}
.play.sm{width:1.7rem;height:1.7rem}.play.sm svg{width:11px;height:11px}

/* entry page */
.entry-head{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:start}
.hw{font-family:var(--he-display);font-size:54px;line-height:1.1;direction:rtl;font-weight:500}
.hw-sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px}
.meaning{font-size:20px;font-weight:500;margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px}
.facts div{background:var(--sheet);padding:10px 14px}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:16px}
.audio-col{display:grid;gap:8px;justify-items:end}
.src{font-size:11px;color:var(--muted);text-align:right;max-width:16em}
.src.rec{color:var(--rec)}

.tablebox{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--paper)}
td.p{color:var(--muted);font-size:13px;white-space:nowrap}
.form{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.form .he{font-size:18px}
.cell-tr{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
td.empty{color:var(--line)}

.ex{display:grid;gap:8px}
.exr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.exr .he{font-size:19px;text-align:right}
.exr .en{color:var(--muted);grid-column:2}
.exr .att{grid-column:2;font-size:11px;color:var(--muted)}
.prep-tag{font-family:var(--he-text);font-weight:600;color:var(--tekhelet);font-size:18px;direction:rtl}
.note{background:var(--tekhelet-soft);border-radius:8px;padding:10px 14px;max-width:70ch}

/* reading */
.texts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:6px}
.tcard:hover{border-color:var(--tekhelet)}
.tcard .he{font-family:var(--he-display);font-size:24px;text-align:right}
.tcard small{color:var(--muted)}
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 0}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.sent.now{background:var(--rec-soft)}
.sent .line{font-family:var(--he-display);font-size:25px;direction:rtl;text-align:right;line-height:1.7}
.sent .en{color:var(--muted);font-size:14px}
.sent .en.hid{filter:blur(5px);cursor:pointer;user-select:none}
.tok{border-bottom:1px dotted var(--muted);cursor:pointer;text-decoration:none;color:inherit;border-radius:3px;padding:0 1px}
.tok:hover,.tok:focus{background:var(--tekhelet-soft);color:var(--tekhelet);outline:none}
.tok.nolink{cursor:help}
#tip{position:fixed;z-index:20;max-width:260px;background:var(--ink);color:var(--sheet);border-radius:8px;padding:8px 10px;font-size:13px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#tip b{font-family:var(--he-text);font-size:16px}
#tip .k{opacity:.7;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--sheet);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--rec);border-color:var(--rec);color:var(--sheet)}
.btn:hover{border-color:var(--tekhelet)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input{flex:1 1 200px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);font:15px var(--ui)}
.fchip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.fchip.on{background:var(--tekhelet);border-color:var(--tekhelet);color:var(--sheet)}
.count{font-size:12px;color:var(--muted);margin-left:auto}
.g.irr{border-color:var(--root);color:var(--root)}
.vwrap{position:relative;flex:none}
.vbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:500}
.vbtn svg{width:16px;height:16px;fill:currentColor}
.vbtn[aria-expanded="true"]{border-color:var(--tekhelet);color:var(--tekhelet)}
.vpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:14px;display:grid;gap:6px;z-index:8}
.vpanel label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.vpanel select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:14px var(--ui);width:100%}
.vpanel .btn{margin-top:8px}
.vnote{font-size:12px;color:var(--muted);margin:4px 0 0}
.banner{font-size:13px;background:var(--root-soft);color:var(--ink);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.home-grid a{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:2px}
.home-grid a:hover{border-color:var(--tekhelet)}
.home-grid .he{font-family:var(--he-display);font-size:26px;color:var(--tekhelet);text-align:right}
.home-grid small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center;margin-top:16px}
.legend span{display:inline-flex;gap:6px;align-items:center}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-block:18px}

@media (max-width:640px){
  .top{flex-wrap:wrap;gap:10px}
  .search{flex-basis:100%;order:3}
  .vwrap{margin-left:auto}
  .row{grid-template-columns:2.4rem minmax(0,1fr) auto;}
  .row .en{grid-column:2 / 4;grid-row:2;font-size:14px}
  .row .meta{grid-row:1;grid-column:3}
  .hw{font-size:42px}
  .entry-head{grid-template-columns:1fr}
  .audio-col{justify-items:start}.src{text-align:left}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#home"><b>מילים</b><span>Milim</span></a>
      <div class="search">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search in English or Hebrew, or by root" aria-label="Search">
        <div id="results" hidden></div>
      </div>
      <div class="vwrap">
        <button id="vbtn" class="vbtn" aria-expanded="false" aria-controls="vpanel" title="Voice settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h2.5L9 3v10L5.5 10H3z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>Voice</span></button>
        <div id="vpanel" class="vpanel" hidden>
          <label for="voiceSel">Voice for words and sentences</label>
          <select id="voiceSel"></select>
          <label for="rateSel">Speed</label>
          <select id="rateSel"><option value="0.6">Very slow</option><option value="0.75">Slow</option><option value="0.9">Normal</option><option value="1">Natural</option><option value="1.15">Fast</option></select>
          <label for="recSel">Real recordings</label>
          <select id="recSel"><option value="on">Use them when available</option><option value="off">Off – always use the synthesized voice</option></select>
          <button id="vtest" class="btn">Play a test sentence</button>
          <p id="vnote" class="vnote"></p>
        </div>
      </div>
    </div>
    <nav id="nav">
      <a href="#verbs">Verbs</a><a href="#nouns">Nouns</a><a href="#adjectives">Adjectives</a><a href="#adverbs">Adverbs</a><a href="#prepositions">Prepositions</a><a href="#pronouns">Pronouns</a><a href="#reading">Recorded texts</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<div id="tip" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => s.replace(/[֑-ׇ]/g,'').replace(/[־׳״'"?!.,:;()–-]/g,'').trim();
const finalize = {'כ':'ך','מ':'ם','נ':'ן','פ':'ף','צ':'ץ'};
const unfinal = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const normHe = s => strip(s).split('').map(c=>unfinal[c]||c).join('');
const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 16 16"><path d="M8 10.5a2.5 2.5 0 0 0 2.5-2.5V3.5a2.5 2.5 0 0 0-5 0V8A2.5 2.5 0 0 0 8 10.5zm4.5-2.5a.75.75 0 0 0-1.5 0 3 3 0 0 1-6 0 .75.75 0 0 0-1.5 0 4.5 4.5 0 0 0 3.75 4.43V14h1.5v-1.57A4.5 4.5 0 0 0 12.5 8z"/></svg>';

/* ---------- audio ---------- */
let voice = null, voicesReady = false, heVoices = [];
const SETTINGS_KEY = 'milim.settings';
let settings = {engine:'phonikud', voice:'auto', rate:'0.9', rec:'on'};
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch(e){}
function saveSettings(){ try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){} }
function autoVoice(vs){ return vs.find(v=>/google/i.test(v.name)) || vs.find(v=>/premium|enhanced|siri/i.test(v.name)) || vs.find(v=>v.localService) || vs[0] || null; }
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  heVoices = speechSynthesis.getVoices().filter(v => /^(he|iw)\b/i.test(v.lang));
  voice = (settings.voice !== 'auto' && heVoices.find(v => v.voiceURI === settings.voice)) || autoVoice(heVoices);
  voicesReady = true; fillVoiceMenu(); updateFoot();
}
function fillVoiceMenu(){
  const sel = document.getElementById('voiceSel'); if(!sel) return;
  const auto = autoVoice(heVoices);
  sel.innerHTML = `<option value="phonikud">Phonikud – natural Hebrew (online)</option><option value="auto">Device: automatic${auto?` (${esc(auto.name)})`:''}</option>` +
    heVoices.map(v => `<option value="${esc(v.voiceURI)}">Device: ${esc(v.name)}${v.localService?'':' · online'}</option>`).join('');
  sel.value = settings.engine === 'phonikud' ? 'phonikud' : (heVoices.some(v=>v.voiceURI===settings.voice) ? settings.voice : 'auto');
  document.getElementById('rateSel').value = settings.rate;
  document.getElementById('recSel').value = settings.rec;
  const n = heVoices.length;
  document.getElementById('vnote').innerHTML = (settings.engine==='phonikud' ? 'Phonikud runs on a free public demo server, so it needs internet and may occasionally be slow; if it doesn’t answer, your device voice takes over. ' : '') + (n === 0
    ? 'No Hebrew voice found on this device. On a Mac: System Settings → Accessibility → Spoken Content → System Voice → Manage Voices → Hebrew. Then reload this page. Chrome on Android includes Google’s Hebrew voice.'
    : `${n} Hebrew voice${n>1?'s':''} on this device. More can be added in your system’s speech settings (on a Mac: Accessibility → Spoken Content → Manage Voices → Hebrew); reload the page afterwards.`);
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let current = null, curBtn = null;
let pkAbort = null, pkWarned = false;
const ttsAudio = new Audio();
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
function stopAll(){ if(current){ current.pause(); current = null; } if(pkAbort){ pkAbort.abort(); pkAbort = null; } ttsAudio.pause(); if('speechSynthesis' in window) speechSynthesis.cancel(); if(curBtn){curBtn.classList.remove('on','loading'); curBtn=null;} document.querySelectorAll('.sent.now').forEach(e=>e.classList.remove('now')); }
function speak(text, btn, done){
  if(settings.engine === 'phonikud') return speakPhonikud(text, btn, done);
  speakDevice(text, btn, done);
}
function speakDevice(text, btn, done){
  stopAll();
  if(!('speechSynthesis' in window)){ alertBanner('This browser has no speech voice. Try Safari or Chrome.'); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/[\u0591-\u05C7]/g, m => m)); u.lang='he-IL'; if(voice) u.voice = voice; u.rate = parseFloat(settings.rate) || 0.9;
  if(btn){ btn.classList.add('on'); curBtn = btn; }
  u.onend = u.onerror = () => { if(btn) btn.classList.remove('on'); if(curBtn===btn) curBtn=null; done && done(); };
  speechSynthesis.speak(u);
}
// Phonikud: free Hebrew voice running as a Hugging Face demo. Word forms go with vowel marks
// ("diacritics" mode, exact pronunciation); sentences go as plain text (most natural).
const PK_URL = 'https://phonikud-phonikud-tts.hf.space/generate';
function speakPhonikud(text, btn, done){
  stopAll();
  // unlock audio inside the tap (needed on iPhone, where audio started later is otherwise blocked)
  try { ttsAudio.src = SILENT; ttsAudio.play().catch(()=>{}); } catch(e){}
  const hasMarks = /[\u05B0-\u05BC\u05C1\u05C2]/.test(text);
  const isSentence = /\s/.test(text.trim()) || /[.?!,]/.test(text);
  const mode = (hasMarks && !isSentence) ? 'diacritics' : 'text';
  const sendText = mode === 'text' ? text.replace(/[\u0591-\u05C7]/g, '') : text;
  const fd = new FormData(); fd.append('mode', mode); fd.append('text', sendText); fd.append('phonemes', '');
  const ctrl = new AbortController(); pkAbort = ctrl;
  if(btn){ btn.classList.add('on','loading'); curBtn = btn; }
  const timer = setTimeout(() => ctrl.abort('timeout'), 12000);
  const fail = (why) => {
    clearTimeout(timer); if(pkAbort === ctrl) pkAbort = null;
    if(why === 'stopped') return;
    if(btn) btn.classList.remove('on','loading');
    if(!pkWarned){ pkWarned = true; alertBanner('The Phonikud voice didn’t answer (it may be busy or offline), so your device voice is used for now.'); }
    speakDevice(sendText, btn, done);
  };
  fetch(PK_URL, {method:'POST', body:fd, signal:ctrl.signal})
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => {
      clearTimeout(timer); if(pkAbort !== ctrl) return; pkAbort = null;
      if(!j || !j.audio) return fail('no audio');
      ttsAudio.src = j.audio; ttsAudio.playbackRate = Math.max(0.5, (parseFloat(settings.rate) || 0.9) / 0.9); ttsAudio.preservesPitch = true;
      ttsAudio.onplaying = () => { if(btn) btn.classList.remove('loading'); };
      ttsAudio.onended = () => { if(btn) btn.classList.remove('on','loading'); if(curBtn===btn) curBtn=null; done && done(); };
      ttsAudio.play().catch(() => { if(btn) btn.classList.remove('on','loading'); alertBanner('Your browser blocked the audio. Tap the play button again.'); });
    })
    .catch(err => fail(ctrl.signal.aborted && ctrl.signal.reason !== 'timeout' ? 'stopped' : 'error'));
}
const AUDIO_CACHE = new Map();
function getAudio(url){ let a = AUDIO_CACHE.get(url); if(!a){ a = new Audio(); a.preload = 'auto'; a.src = url; AUDIO_CACHE.set(url, a); } return a; }
function playUrl(url, btn, done){
  stopAll();
  const a = getAudio(url); current = a;
  if(btn){ btn.classList.add('on'); if(a.readyState < 3) btn.classList.add('loading'); curBtn = btn; }
  let finished = false;
  const end = () => { if(finished) return; finished = true; if(btn){ btn.classList.remove('on','loading'); } if(current===a) current=null; done && done(); };
  a.onplaying = () => { if(btn) btn.classList.remove('loading'); };
  a.onended = end;
  a.onerror = () => { AUDIO_CACHE.delete(url); end(); if(btn && btn.dataset.he){ alertBanner('That recording didn’t load from Tatoeba (check your internet connection), so you’re hearing the synthesized voice instead.'); speak(btn.dataset.he, btn, null); } else alertBanner('The recording could not load. Check your internet connection.'); };
  try { a.currentTime = 0; } catch(e){}
  a.play().catch(err => { if(err && err.name === 'NotAllowedError'){ finished = true; if(btn) btn.classList.remove('on','loading'); if(current===a) current=null; alertBanner('Your browser blocked automatic playback. Tap a sentence’s play button to hear it.'); } });
}
// download a text's recordings in the background, two at a time, so taps play instantly
let preloadToken = 0;
function preloadUrls(urls){
  const token = ++preloadToken; const q = urls.filter(u => !AUDIO_CACHE.has(u) || AUDIO_CACHE.get(u).readyState < 4);
  const worker = async () => { while(q.length && token === preloadToken){ const u = q.shift(); const a = getAudio(u);
      if(a.readyState >= 4) continue;
      await new Promise(r => { const t = setTimeout(r, 45000); const fin = () => { clearTimeout(t); r(); }; a.addEventListener('canplaythrough', fin, {once:true}); a.addEventListener('error', fin, {once:true}); try{ a.load(); }catch(e){ fin(); } });
      markReady(u); } };
  worker(); worker();
}
function markReady(u){ document.querySelectorAll('.play[data-tat]').forEach(b => { if(tatoebaUrl(b.dataset.tat) === u && AUDIO_CACHE.get(u) && AUDIO_CACHE.get(u).readyState >= 3) b.classList.add('ready'); }); }
function commonsUrl(f){ return 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f); }
function tatoebaUrl(aid){ return 'https://tatoeba.org/audio/download/' + aid; }
// buttons: data-say="hebrew text" (TTS) or data-rec="commons file" / data-tat="sentence id"
document.addEventListener('click', e => {
  const b = e.target.closest('.play'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  if(b.classList.contains('on')){ stopAll(); return; }
  if(b.dataset.rec) playUrl(commonsUrl(b.dataset.rec), b);
  else if(b.dataset.tat) playUrl(tatoebaUrl(b.dataset.tat), b);
  else speak(b.dataset.say, b);
});
function sayBtn(text, sm){ return `<button class="play${sm?' sm':''}" data-say="${esc(text)}" title="Listen (synthesized voice)" aria-label="Listen: ${esc(text)}">${ICON_PLAY}</button>`; }
function recBtn(file, sm, text){ if(settings.rec==='off' && text) return sayBtn(text, sm); return `<button class="play rec${sm?' sm':''}" data-rec="${esc(file)}" title="Play native-speaker recording" aria-label="Play recording">${ICON_MIC}</button>`; }
function tatBtn(aid, sm, he){ if(settings.rec==='off' && he) return sayBtn(he, sm); return `<button class="play rec${sm?' sm':''}" data-tat="${aid}" data-he="${esc(he||'')}" title="Play native-speaker recording" aria-label="Play recording">${ICON_MIC}</button>`; }
function wordBtn(plain, sm, sayText){ const f = DATA.commons[plain]; return f ? recBtn(f, sm, sayText||plain) : sayBtn(sayText||plain, sm); }
function alertBanner(msg){ const d=document.createElement('div'); d.className='banner'; d.textContent=msg; main.prepend(d); setTimeout(()=>d.remove(), 6000); }

/* ---------- index ---------- */
const entries = {}; const list = {verbs:[],nouns:[],adjectives:[],adverbs:[],prepositions:[],pronouns:[]};
const formIndex = {};   // normalized hebrew form -> [{id, label}]
const trIndex = {};
function addTr(tr, id, label, he){ if(!tr) return; const k = tr.toLowerCase().replace(/['\s-]/g,''); (trIndex[k]=trIndex[k]||[]); if(!trIndex[k].some(x=>x.id===id)) trIndex[k].push({id,label,he}); }
function addForm(he, id, label, tr){ if(tr) addTr(tr, id, label, he); const k = normHe(he); if(!k) return; (formIndex[k] = formIndex[k] || []); if(!formIndex[k].some(x=>x.id===id)) formIndex[k].push({id,label}); }
DATA.preps.forEach(p => { p.kind='preposition'; entries[p.id]=p; list.prepositions.push(p); addForm(p.plain,p.id,'preposition'); (p.forms||[]).forEach((f,i)=>addForm(f[0],p.id,'+ '+DATA.persons.pron[i],f[1])); });
DATA.pronouns.forEach(g => { g.kind='pronouns'; entries[g.id]=g; list.pronouns.push(g); g.items.concat(g.extra||[]).forEach(it=>addForm(it[0], g.id, it[2], it[1])); });
DATA.verbs.forEach(v => { v.kind='verb'; entries[v.id]=v; list.verbs.push(v); addForm(v.plain, v.id, 'infinitive');
  ['present','past','future','imperative'].forEach(t => (v.conj[t]||[]).forEach((f,i) => f && addForm(f[0], v.id, t+' · '+DATA.persons[t][i], f[1]))); });
DATA.nouns.forEach(n => { n.kind='noun'; entries[n.id]=n; list.nouns.push(n); addForm(n.plain,n.id,'singular'); addForm(n.plural,n.id,'plural',n.plural_tr); });
DATA.adjs.forEach(a => { a.kind='adjective'; entries[a.id]=a; list.adjectives.push(a); a.forms.forEach((f,i)=>addForm(f[0],a.id,['m. sing.','f. sing.','m. pl.','f. pl.'][i],f[1])); });
DATA.advs.forEach(a => { a.kind='adverb'; entries[a.id]=a; list.adverbs.push(a); addForm(a.plain,a.id,'adverb'); });
Object.entries(DATA.prefer||{}).forEach(([k,id]) => { const key = normHe(k); if(formIndex[key]) formIndex[key].sort((a,b)=>(a.id===id?0:1)-(b.id===id?0:1)); });
const rootIndex = {};
Object.values(entries).forEach(e => { if(e.root){ const k=normHe(e.root); (rootIndex[k]=rootIndex[k]||[]).push(e.id); } });

/* ---------- search ---------- */
const PREFIXES = ['ו','ה','ב','ל','מ','ש','כ'];
function orderHits(hits, pre){
  let h = hits.slice();
  if(pre && pre.endsWith('ה')){ const non = h.filter(x=>entries[x.id].kind!=='verb'); if(non.length) h = non.concat(h.filter(x=>entries[x.id].kind==='verb')); }
  return h;
}
function lookupForm(tok){
  const k = normHe(tok); if(!k) return null;
  if(formIndex[k]){
    const hits = formIndex[k];
    // ה + noun beats a rare imperative with the same spelling (הזמן = the time)
    if(k.startsWith('ה') && hits.every(x=>entries[x.id].kind==='verb' && /^imperative/.test(x.label)) && formIndex[k.slice(1)]){
      const non = formIndex[k.slice(1)].filter(x=>entries[x.id].kind!=='verb'); if(non.length) return {hits:non, prefix:'ה'};
    }
    return {hits:hits, prefix:''};
  }
  // strip up to 3 one-letter prefixes (ו, ש, כש, ב/ל/כ/מ, ה)

function search(qRaw){
  const q = qRaw.trim(); if(!q) return [];
  const out = []; const seen = new Set();
  const push = (id, why, score) => { if(seen.has(id)) return; seen.add(id); out.push({id, why, score}); };
  if(/[֐-׿]/.test(q)){
    const k = normHe(q);
    if(formIndex[k]) formIndex[k].forEach(h => push(h.id, h.label, 0));
    if(rootIndex[normHe(q)]) rootIndex[normHe(q)].forEach(id => push(id, 'root '+entries[id].root, 1));
    const lf = lookupForm(q); if(lf) lf.hits.forEach(h => push(h.id, (lf.prefix?lf.prefix+'־ + ':'')+h.label, 2));
    Object.keys(formIndex).forEach(f => { if(f.startsWith(k) && f!==k) formIndex[f].forEach(h=>push(h.id, h.label, 3)); });
    Object.keys(rootIndex).forEach(r => { if(r.includes(k) && k.length>=2) rootIndex[r].forEach(id=>push(id,'root '+entries[id].root,4)); });
  } else {
    const ql = q.toLowerCase().replace(/^to /,'');
    const re = new RegExp('(^|[^a-z])' + ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    Object.values(entries).forEach(e => {
      const ens = e.kind==='pronouns' ? e.items.map(i=>i[2]).concat([e.title]) : e.en;
      const raw = ens.find(m => m.toLowerCase().replace(/^to /,'') === ql);
      const exact = ens.find(m => m.toLowerCase().replace(/^to /,'').replace(/ \(.*\)$/,'') === ql);
      if(raw) push(e.id, raw, 0);
      else if(exact) push(e.id, exact, 1);
      else if(ens.some(m => re.test(m))) push(e.id, ens.find(m=>re.test(m)), 2);
      else if(e.tr && e.tr.toLowerCase().replace(/'/g,'').startsWith(ql.replace(/'/g,''))) push(e.id, 'transliteration', 3);
    });

  }

}

  const c = k => list[k].length;
  main.innerHTML = `<h1>Hebrew words you can hear</h1><p class="lede">Search above in English or Hebrew, or by root letters. Every word and sentence has a play button.</p>
  <div class="home-grid">
   <a href="#verbs"><span class="he">פעלים</span><b>Verbs</b><small>${c('verbs')} verbs with conjugation tables</small></a>
   <a href="#nouns"><span class="he">שמות עצם</span><b>Nouns</b><small>${c('nouns')} nouns with gender and plural</small></a>
   <a href="#adjectives"><span class="he">שמות תואר</span><b>Adjectives</b><small>${c('adjectives')} adjectives in all four forms</small></a>
   <a href="#adverbs"><span class="he">תוארי פועל</span><b>Adverbs</b><small>${c('adverbs')} adverbs</small></a>
   <a href="#prepositions"><span class="he">מילות יחס</span><b>Prepositions</b><small>${c('prepositions')} prepositions, with pronoun tables</small></a>
   <a href="#pronouns"><span class="he">כינויים</span><b>Pronouns</b><small>${c('pronouns')} groups, every form</small></a>
   <a href="#reading"><span class="he">טקסטים מוקלטים</span><b>Recorded texts</b><small>${DATA.texts.length} themed sets, ${DATA.sentences.length} recorded sentences</small></a>
  </div>
  <div class="legend"><span>${recBtn('',true).replace('data-rec=""','disabled')} Native-speaker recording</span><span>${sayBtn('',true).replace('data-say=""','disabled')} Synthesized voice</span><span>${rootChip('כ-ת-ב')} Root (tap to see the word family)</span></div>`;
}
function updateFoot(){
  $('#foot').innerHTML = `Word recordings: Lingua Libre speakers on Wikimedia Commons. Sentence recordings: Tatoeba contributors. Both CC-licensed. ${settings.engine==='phonikud' ? 'Synthesized audio: <b>Phonikud</b>, an open-source Hebrew voice (huggingface.co/spaces/Phonikud/phonikud-tts), with your device voice as backup. Change it under Voice at the top.' : `Synthesized audio uses your device’s Hebrew voice${voice?` (<b>${esc(voice.name)}</b> – change it under Voice at the top)`: voicesReady ? ' – <b>none found on this device</b>; see Voice at the top':''}.`}`;
}

/* voice panel */
const vbtn = $('#vbtn'), vpanel = $('#vpanel');
vbtn.addEventListener('click', e => { e.stopPropagation(); vpanel.hidden = !vpanel.hidden; vbtn.setAttribute('aria-expanded', String(!vpanel.hidden)); if(!vpanel.hidden) fillVoiceMenu(); });
document.addEventListener('click', e => { if(!e.target.closest('.vwrap')){ vpanel.hidden = true; vbtn.setAttribute('aria-expanded','false'); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !vpanel.hidden){ vpanel.hidden = true; vbtn.setAttribute('aria-expanded','false'); vbtn.focus(); } });
$('#voiceSel').addEventListener('change', e => { setTimeout(updateFoot, 0); const v = e.target.value; if(v === 'phonikud'){ settings.engine = 'phonikud'; } else { settings.engine = 'device'; settings.voice = v; } pkWarned = false; saveSettings(); pickVoice(); speak('שלום, מה שלומך?', null); });
$('#rateSel').addEventListener('change', e => { settings.rate = e.target.value; saveSettings(); speak('שלום, מה שלומך?', null); });
$('#recSel').addEventListener('change', e => { settings.rec = e.target.value; saveSettings(); route(); });
$('#vtest').addEventListener('click', e => { e.stopPropagation(); speak('שלום, מה שלומך?', e.currentTarget); });

/* router */
function route(){
  stopAll(); tip.hidden = true;
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href')==='#'+h || (h.startsWith('w-') && entries[h.slice(2)] && SECTIONS[a.getAttribute('href').slice(1)] && list[a.getAttribute('href').slice(1)].includes(entries[h.slice(2)])) || (h.startsWith('t-') && a.getAttribute('href')==='#reading')));
  if(h==='home') viewHome();
  else if(SECTIONS[h]) viewList(h);
  else if(h==='reading') viewReading();
  else if(h.startsWith('w-')) viewEntry(h.slice(2));
  else if(h.startsWith('t-')) viewText(h.slice(2));
  else if(h.startsWith('root-')) viewRoot(h.slice(5));
  else viewHome();
  scrollTo(0,0);
}
addEventListener('hashchange', route);
updateFoot(); route();
})();
</script>
</body>
</html>
